<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jose Montesinos</title>
  <meta name="description" content="Jose Montesinos — autor de Aprender a acompañarnos." />
  <style>
    :root{--bg:#efebe4;--ink:#1f2328;--muted:#6f6a64;--line:#cfc8bf;--card:#f8f5f0}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}
    main{min-height:100vh;display:grid;place-items:center;padding:48px 20px}.wrap{max-width:760px;width:100%;text-align:center}
    .eyebrow{font-family:Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem;color:var(--muted);margin-bottom:18px}
    h1{font-size:clamp(2.2rem,7vw,4.5rem);font-weight:500;line-height:1.08;margin:0 0 18px}.sub{font-size:1.2rem;color:var(--muted);margin:0 auto 34px;max-width:620px}
    .rule{height:1px;background:var(--line);width:84px;margin:0 auto 34px}.name{font-family:Arial,sans-serif;font-size:.95rem;letter-spacing:.06em}
    a{color:inherit}.links{margin-top:28px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.btn{font-family:Arial,sans-serif;text-decoration:none;border:1px solid var(--ink);padding:10px 16px;border-radius:999px;font-size:.92rem;background:transparent}
  </style>
</head>
<body>
<main><div class="wrap">
  <div class="eyebrow">Jose Montesinos</div>
  <h1>Aprender a acompañarnos</h1>
  <p class="sub">Un recorrido por el cuerpo, las emociones y nuestra propia experiencia.</p>
  <div class="rule"></div>
  <p>Si has llegado hasta aquí desde el libro, gracias por continuar la conversación fuera de sus páginas.</p>
  <div class="links"><a class="btn" href="/libro/">Entrar</a><a class="btn" href="mailto:hola@soyjosemontesinos.es">Escribirme</a></div>
</div></main>
</body>
</html>
